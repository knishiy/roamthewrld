name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # Node 18 is end-of-life; matches local dev (v22) and engines >=20.9
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Build and Export with Next.js
        run: |
          npm run build
          touch out/.nojekyll
          # Next's static export already writes a real out/404.html (app/not-found.tsx);
          # copying index.html over it made every bad URL serve the home page (soft 404).
          # Apex is the canonical domain (www 301-redirects to it).
          echo "roamthewrld.com" > out/CNAME
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
